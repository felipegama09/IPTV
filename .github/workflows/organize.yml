name: Organize
on: workflow_dispatch
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mover arquivos para as pastas
        run: |
          set -e
          mkdir -p gradle/wrapper app/src/main/java/br/nova/iptv app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable
          mv gradle-wrapper.jar gradle-wrapper.properties gradle/wrapper/
          mv proguard-rules.pro app/
          mv AndroidManifest.xml app/src/main/
          mv Adapters.kt App.kt Core.kt LoginActivity.kt MainActivity.kt PlayerActivity.kt Sources.kt app/src/main/java/br/nova/iptv/
          mv activity_login.xml activity_main.xml activity_player.xml item_card.xml item_cat.xml app/src/main/res/layout/
          mv colors.xml strings.xml styles.xml app/src/main/res/values/
          mv banner.xml bg_card.xml bg_cat.xml bg_gradient.xml bg_input.xml bg_panel.xml bg_tab.xml ic_launcher.xml ph.xml app/src/main/res/drawable/
          rm -f build.yml
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "br.nova.iptv"
              compileSdk = 34

              defaultConfig {
                  applicationId = "br.nova.iptv"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.recyclerview:recyclerview:1.3.2")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")

              val media3 = "1.4.1"
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-exoplayer-hls:$media3")
              implementation("androidx.media3:media3-ui:$media3")

              implementation("io.coil-kt:coil:2.7.0")
          }
          EOF
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Organizar estrutura do projeto"
          git push
